<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Café Conffe</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <!-- Animação de abertura (splash) -->
  <div id="splash">
    <img id="splashLogo" src="assets/img/conffe-logo.svg" alt="Café Conffe">
    <div id="splashName">Café Conffe</div>
  </div>

  <!-- Cabeçalho -->
  <header>
    <div class="container head">
      <div class="brand">
        <img id="logo" src="assets/img/conffe-icone.svg" alt="Café Conffe">
        <div>
          <h1 id="name">Café Conffe Cafeteria</h1>
          <small id="tagline">Seja Bem-Vindo!</small>
        </div>
      </div>
      <button class="cart" data-bs-toggle="offcanvas" data-bs-target="#cart">
        <i class="bi bi-bag"></i>
        <b id="count">0</b>
      </button>
    </div>
  </header>

  <!-- Menu de categorias -->
  <nav>
    <div class="container">
      <div id="cats" class="cats"></div>
    </div>
  </nav>

  <!-- Conteúdo principal -->
  <main class="container py-4">
    <div class="hero">
      <h2 id="title">Uma pausa para saborear</h2>
      <p id="desc">Cafés selecionados e delícias preparadas com carinho para você aproveitar cada momento.</p>
    </div>
    <div id="menu"></div>
  </main>

  <!-- Rodapé -->
  <footer>
    <p id="footer">Todos os direitos reservados.</p>
    <p id="footer-2 mt-1">By: Punpledesign</p>
    <span id="address"></span>
    <a id="insta" class="d-none" target="_blank">Instagram</a>
  </footer>

  <!-- Carrinho (offcanvas) -->
  <div class="offcanvas offcanvas-end" id="cart">
    <div class="offcanvas-header">
      <h5>Seu pedido</h5>
      <button class="btn-close" data-bs-dismiss="offcanvas"></button>
    </div>
    <div class="offcanvas-body">
      <div id="items"></div>
    </div>
    <div class="cart-foot">
      <div class="total">
        <span>Total</span>
        <strong id="total">R$ 0,00</strong>
      </div>
      <textarea id="note" class="form-control mb-2" placeholder="Observação"></textarea>
      <button id="send" class="btn btn-success w-100">
        <i class="bi bi-whatsapp"></i> Finalizar pelo WhatsApp
      </button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
