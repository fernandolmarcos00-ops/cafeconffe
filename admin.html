<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Painel do cardápio</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"><link rel="stylesheet" href="assets/css/admin.css"></head><body>
<div id="login" class="login"><div class="login-card"><div class="logo-letter">S</div><h1>Painel do cardápio</h1><p>Entre para administrar seus produtos.</p><form id="loginForm"><input id="email" type="email" class="form-control mb-2" placeholder="E-mail" required><input id="pass" type="password" class="form-control mb-3" placeholder="Senha" required><button class="btn btn-primary w-100">Entrar</button><small id="loginMsg"></small></form></div></div>
<div id="app" class="d-none"><header><div class="container-fluid admin-head"><div><b>Painel do cardápio</b><small>Olá, <span id="userEmail"></span></small></div><div><a href="index.html" target="_blank" class="btn btn-sm btn-outline-secondary">Ver cardápio</a><button id="logout" class="btn btn-sm btn-link">Sair</button></div></div></header><main class="container py-4"><nav class="tabs"><button class="active" data-tab="products">Produtos</button><button data-tab="categories">Categorias</button><button data-tab="info">Informações</button></nav>
<section id="products" class="tab active"><div class="heading"><div><h1>Produtos</h1><p>Adicione, edite ou exclua os itens.</p></div><button id="newProduct" class="btn btn-primary">+ Novo produto</button></div><div id="productList"></div></section>
<section id="categories" class="tab"><div class="heading"><div><h1>Categorias</h1><p>Crie grupos e altere a ordem.</p></div></div><div id="categoryList" class="row g-3"></div><div class="card p-4 mt-4"><h2>Nova categoria</h2><form id="categoryForm" class="row g-3"><div class="col-md-3"><label>Nome</label><input id="catName" class="form-control" required></div><div class="col-md-3"><label>Identificador</label><input id="catSlug" class="form-control"></div><div class="col-md-3"><label>Texto de apoio</label><input id="catSupport" class="form-control"></div><div class="col-md-2"><label>Ordem</label><input id="catOrder" type="number" value="1" class="form-control"></div><div class="col-12"><button class="btn btn-primary">+ Adicionar categoria</button></div></form></div></section>
<section id="info" class="tab"><div class="card p-4"><h1>Informações do negócio</h1><p>Tudo que aparece no cardápio.</p><form id="infoForm" class="row g-3"><div class="col-md-6"><label>Nome do negócio</label><input id="iName" class="form-control"></div><div class="col-md-6"><label>Letra/símbolo do logo</label><input id="iLetter" class="form-control"></div><div class="col-md-6"><label>Chamada curta</label><input id="iTag" class="form-control"></div><div class="col-md-6"><label>WhatsApp com DDD</label><input id="iWhats" class="form-control"></div><div class="col-12"><label>Título principal</label><input id="iTitle" class="form-control"></div><div class="col-12"><label>Descrição</label><textarea id="iDesc" class="form-control"></textarea></div><div class="col-md-6"><label>Instagram</label><input id="iInsta" class="form-control"></div><div class="col-md-6"><label>Endereço</label><input id="iAddress" class="form-control"></div><div class="col-12"><label>Texto do rodapé</label><input id="iFooter" class="form-control"></div><div><button class="btn btn-primary">Salvar informações</button><span id="infoMsg"></span></div></form></div></section></main></div>
<div class="modal fade" id="productModal"><div class="modal-dialog modal-lg"><div class="modal-content"><form id="productForm"><div class="modal-header"><h5 id="modalTitle">Novo produto</h5><button class="btn-close" data-bs-dismiss="modal" type="button"></button></div><div class="modal-body"><input id="pId" type="hidden"><div class="row g-3"><div class="col-md-8"><label>Nome</label><input id="pName" class="form-control" required></div><div class="col-md-4"><label>Preço</label><input id="pPrice" type="number" step="0.01" class="form-control" required></div><div class="col-12"><label>Descrição</label><textarea id="pDesc" class="form-control"></textarea></div><div class="col-md-6"><label>Categoria</label><select id="pCat" class="form-select" required></select></div><div class="col-md-6"><label>Ordem</label><input id="pOrder" type="number" value="1" class="form-control"></div><div class="col-12"><label>Imagem</label><input id="pImage" type="file" accept="image/*" class="form-control"><img id="preview" class="preview d-none"></div><div class="col-12"><label><input id="pAvailable" type="checkbox" checked> Produto disponível</label></div><small id="pMsg"></small></div></div><div class="modal-footer"><button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancelar</button><button class="btn btn-primary">Salvar produto</button></div></form></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/config.js"></script><script src="assets/js/admin.js"></script><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body></html>
